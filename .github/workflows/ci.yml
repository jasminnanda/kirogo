name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build, vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      # The whole point of kirogo is that it has none. A dependency sneaking in
      # should fail the build, not be noticed later.
      - name: Assert zero dependencies
        run: |
          if grep -q '^require' go.mod; then
            echo "::error file=go.mod::go.mod gained a require block; kirogo is standard library only"
            exit 1
          fi
          if [ -f go.sum ]; then
            echo "::error file=go.sum::go.sum exists, which means a dependency was added"
            exit 1
          fi

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt reported unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Test with the race detector
        run: go test -race -count=1 ./...

  build-matrix:
    name: Cross-compile ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build static binary
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w" -o kirogo-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/kirogo

      - uses: actions/upload-artifact@v4
        with:
          name: kirogo-${{ matrix.goos }}-${{ matrix.goarch }}
          path: kirogo-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: 14

  docker:
    name: Build and smoke-test the container image
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --build-arg VERSION=ci -t kirogo:ci .

      # Building proves the Dockerfile compiles. It does not prove the image runs,
      # and the two failure modes are different: a missing CA bundle or a base
      # image without the runtime user only shows up on start. So actually start
      # it and require a healthy answer.
      - name: Start the container
        run: |
          docker run -d --name kirogo-ci \
            -p 127.0.0.1:8000:8000 \
            -e PROXY_API_KEY=ci-smoke-test-key \
            -e KIRO_CREDS_FILE=/creds/absent.json \
            kirogo:ci

      # kirogo exits when it cannot load the model catalog, and CI has no Kiro
      # credentials, so a clean startup is not reachable here. What is verifiable
      # is that the binary starts, runs as the unprivileged user, and fails for
      # the honest reason rather than a broken image.
      - name: Assert it failed on credentials, not on a broken image
        run: |
          sleep 5
          logs=$(docker logs kirogo-ci 2>&1 || true)
          echo "$logs"

          if echo "$logs" | grep -qiE 'no such file or directory: /usr/local/bin/kirogo|exec format error|not found'; then
            echo "::error::the image cannot execute the binary"
            exit 1
          fi
          if echo "$logs" | grep -qiE 'x509|certificate signed by unknown authority'; then
            echo "::error::the image is missing a CA trust store"
            exit 1
          fi
          if ! echo "$logs" | grep -qiE 'credential|creds|catalog|sign in'; then
            echo "::error::expected a credentials or catalog error, got something else"
            exit 1
          fi

      - name: Assert the image does not run as root
        run: |
          uid=$(docker run --rm --entrypoint id kirogo:ci -u)
          echo "container uid: $uid"
          if [ "$uid" = "0" ]; then
            echo "::error::image runs as root"
            exit 1
          fi

      - name: Assert the stamped version is reported
        run: |
          reported=$(docker run --rm kirogo:ci -version)
          echo "reported: $reported"
          case "$reported" in
            *ci*) ;;
            *) echo "::error::-version did not report the stamped VERSION"; exit 1 ;;
          esac

      - name: Clean up
        if: always()
        run: docker rm -f kirogo-ci || true
